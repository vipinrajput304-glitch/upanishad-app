<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>उपनिषद् ज्ञान कोश</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+Devanagari:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--g:#C9A84C;--gl:#E8C97A;--gd:#7A6130;--bg:#080705;--b3:#151209;--b4:#1c1710;--t:#E8DCC8;--td:#9A8A6A;--tf:#5A4A30;--br:rgba(201,168,76,0.18);--bs:rgba(201,168,76,0.08);--green:#52B788;--pu:#C084D4;--or:#C8956A;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--t);font-family:'Crimson Pro',Georgia,serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 80% 10%,rgba(201,168,76,0.05),transparent 60%),radial-gradient(ellipse 60% 80% at 10% 90%,rgba(45,106,79,0.04),transparent 60%);pointer-events:none;z-index:0;}
.sc{display:none;position:relative;z-index:1;}.sc.on{display:block;}
.hdr{text-align:center;padding:44px 20px 28px;border-bottom:1px solid var(--br);background:linear-gradient(180deg,rgba(201,168,76,0.07),transparent);}
.om{font-size:56px;color:var(--g);margin-bottom:14px;text-shadow:0 0 60px rgba(201,168,76,0.5);animation:pl 4s ease-in-out infinite;}
@keyframes pl{0%,100%{text-shadow:0 0 40px rgba(201,168,76,0.3);}50%{text-shadow:0 0 80px rgba(201,168,76,0.7),0 0 120px rgba(201,168,76,0.2);}}
.ht{font-family:'Noto Sans Devanagari',serif;font-size:26px;font-weight:400;color:var(--gl);letter-spacing:2px;margin-bottom:4px;}
.hs{font-size:12px;color:var(--tf);letter-spacing:3px;text-transform:uppercase;margin-bottom:5px;}
.hd{font-size:13px;color:var(--td);}
.sbar{display:flex;justify-content:space-around;margin:16px;padding:14px;background:rgba(201,168,76,0.06);border:1px solid var(--br);border-radius:18px;}
.sn{font-size:22px;font-weight:600;color:var(--g);text-align:center;}.sl{font-size:10px;color:var(--tf);letter-spacing:1px;margin-top:2px;text-align:center;}
.lbl{font-size:10px;letter-spacing:3px;color:var(--tf);text-transform:uppercase;padding:0 16px 10px;}
.uc{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:0 12px 10px;background:var(--b3);border-radius:16px;border:1px solid var(--bs);cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;}
.uc:active{border-color:var(--br);background:var(--b4);}
.uc::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--cc,var(--gd));}
.ci{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);}
.cn{font-family:'Noto Sans Devanagari',serif;font-size:18px;color:var(--t);margin-bottom:2px;}
.ce{font-size:12px;color:var(--td);margin-bottom:3px;}.cd{font-size:11px;color:var(--tf);line-height:1.4;}
.cm{display:flex;align-items:center;gap:6px;margin-top:5px;}
.cc{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(201,168,76,0.1);color:var(--gd);border:1px solid var(--br);}
.pw{flex:1;height:3px;background:rgba(255,255,255,0.06);border-radius:2px;}
.pb{height:3px;border-radius:2px;background:var(--cc,var(--gd));transition:width 0.5s;}
.ca{color:var(--gd);font-size:16px;}
.lhdr{padding:20px 16px 16px;background:linear-gradient(135deg,rgba(201,168,76,0.07),transparent);border-bottom:1px solid var(--br);}
.bb{background:none;border:none;color:var(--g);font-size:15px;cursor:pointer;padding:0;margin-bottom:12px;font-family:'Crimson Pro',serif;}
.lt{display:flex;align-items:center;gap:14px;}.li{font-size:42px;}
.ln{font-family:'Noto Sans Devanagari',serif;font-size:22px;color:var(--gl);}.ls{font-size:12px;color:var(--td);margin-top:2px;}
.res{margin:12px 16px;padding:12px 16px;background:rgba(201,168,76,0.08);border:1px solid var(--br);border-radius:14px;cursor:pointer;display:flex;align-items:center;gap:12px;}
.res:active{background:rgba(201,168,76,0.14);}
.ri{font-size:22px;}.rt{flex:1;}.rl{font-size:12px;color:var(--td);}.rm{font-size:14px;color:var(--g);font-family:'Noto Sans Devanagari',serif;}.ra{color:var(--g);font-size:18px;}
.mi{display:flex;align-items:center;gap:12px;padding:13px 16px;margin:0 12px 8px;background:var(--b3);border-radius:14px;border:1px solid var(--bs);cursor:pointer;transition:all 0.2s;}
.mi:active,.mi.cur{border-color:var(--br);background:var(--b4);}.mi.cur{border-color:var(--gd);background:rgba(201,168,76,0.06);}
.mn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--td);flex-shrink:0;}
.mn.dn{background:rgba(201,168,76,0.15);border-color:var(--gd);color:var(--g);}
.mn.cr{background:var(--g);border-color:var(--g);color:#000;font-weight:600;}
.ms{font-family:'Noto Sans Devanagari',serif;font-size:14px;color:var(--td);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mvh{position:sticky;top:0;z-index:50;background:rgba(8,7,5,0.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--br);padding:14px 16px 12px;}
.mvt{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.mb{background:none;border:none;color:var(--g);font-size:15px;cursor:pointer;font-family:'Crimson Pro',serif;}
.mtb{flex:1;text-align:center;}.mu{font-family:'Noto Sans Devanagari',serif;font-size:14px;color:var(--td);}.mm{font-size:11px;color:var(--tf);margin-top:1px;}
.bk{background:none;border:none;font-size:18px;cursor:pointer;}
.pg{height:2px;background:rgba(255,255,255,0.06);border-radius:1px;}
.pgf{height:2px;background:linear-gradient(90deg,var(--gd),var(--g));border-radius:1px;transition:width 0.4s;}
.mvb{padding:16px 14px 140px;}
.sk{background:linear-gradient(135deg,rgba(201,168,76,0.1),rgba(201,168,76,0.03));border:1px solid var(--br);border-radius:18px;padding:22px 18px;margin-bottom:14px;position:relative;overflow:hidden;}
.sk::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--g),transparent);}
.skl{font-size:9px;letter-spacing:3px;color:var(--tf);text-transform:uppercase;margin-bottom:12px;}
.skt{font-family:'Noto Sans Devanagari',serif;font-size:18px;color:var(--gl);line-height:2.2;text-align:center;white-space:pre-line;}
.ro{font-family:'EB Garamond',serif;font-style:italic;font-size:13px;color:var(--td);text-align:center;line-height:1.8;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.05);}
.ap{background:linear-gradient(135deg,rgba(201,168,76,0.08),rgba(201,168,76,0.02));border:1px solid var(--br);border-radius:18px;padding:18px 16px;margin-bottom:14px;position:relative;overflow:hidden;}
.ap::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--g),transparent);}
.apl{font-size:9px;letter-spacing:3px;color:var(--tf);text-transform:uppercase;margin-bottom:14px;}
.apc{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.apb{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--g),var(--gd));border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(201,168,76,0.35);transition:transform 0.15s;}
.apb:active{transform:scale(0.92);}.apb.pl{background:linear-gradient(135deg,#c04040,#802020);}
.api{flex:1;}.aps{font-size:13px;color:var(--t);margin-bottom:3px;}.aph2{font-size:11px;color:var(--tf);}
.wv{display:flex;align-items:center;gap:3px;height:28px;justify-content:center;margin-bottom:12px;}
.wb{width:4px;border-radius:2px;background:var(--gd);}.wb.on{background:var(--g);}
.ass{display:flex;gap:8px;flex-wrap:wrap;}
.ab{padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--td);transition:all 0.2s;}
.ab.on{background:rgba(201,168,76,0.2);border-color:var(--gd);color:var(--g);}
.ahl{background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.25);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:none;font-family:'Noto Sans Devanagari',serif;font-size:15px;color:var(--gl);text-align:center;line-height:1.8;}
.ahl.on{display:block;}
.tabs{display:flex;gap:5px;margin-bottom:14px;background:var(--b3);border:1px solid var(--br);border-radius:14px;padding:4px;}
.tb{flex:1;padding:8px 4px;border:none;border-radius:10px;font-family:'Noto Sans Devanagari',serif;font-size:12px;cursor:pointer;background:none;color:var(--tf);transition:all 0.2s;}
.tb.on{background:linear-gradient(135deg,rgba(201,168,76,0.2),rgba(201,168,76,0.07));color:var(--gl);outline:1px solid rgba(201,168,76,0.25);}
.pn{display:none;animation:fu 0.3s ease both;}.pn.on{display:block;}
@keyframes fu{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.mb2{background:var(--b3);border:1px solid var(--bs);border-radius:16px;padding:16px 14px;margin-bottom:12px;}
.ml{font-size:9px;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.05);}
.mhi{font-family:'Noto Sans Devanagari',serif;font-size:15px;line-height:2.1;color:var(--t);font-weight:300;}
.men{font-family:'EB Garamond',serif;font-style:italic;font-size:16px;line-height:1.85;color:var(--td);}
.me{padding:12px 14px;background:var(--b3);border:1px solid var(--bs);border-radius:12px;margin-top:4px;font-size:12px;color:var(--tf);font-family:'EB Garamond',serif;font-style:italic;line-height:1.7;}
.wh{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:4px 12px 8px;font-size:9px;color:var(--tf);letter-spacing:2px;text-transform:uppercase;}
.wr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:11px 12px;margin-bottom:7px;background:var(--b3);border:1px solid rgba(255,255,255,0.04);border-radius:12px;align-items:start;}
.ws{font-family:'Noto Sans Devanagari',serif;font-size:14px;color:var(--g);}
.whi{font-size:12px;color:var(--td);line-height:1.5;}
.we{font-size:11px;font-family:'EB Garamond',serif;font-style:italic;color:var(--tf);line-height:1.5;}
.gn{padding:14px;background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.15);border-radius:14px;margin-top:4px;}
.gnl{font-size:9px;letter-spacing:2px;color:var(--tf);text-transform:uppercase;margin-bottom:8px;}
.gnt{font-size:13px;color:var(--td);font-family:'EB Garamond',serif;font-style:italic;line-height:1.8;}
.gnt strong{color:var(--g);font-style:normal;}
.tt{display:flex;gap:6px;margin-bottom:14px;}
.tbt{flex:1;padding:8px 4px;border-radius:20px;font-size:10px;cursor:pointer;font-family:'Noto Sans Devanagari',serif;transition:all 0.2s;text-align:center;line-height:1.4;}
.ta{background:rgba(200,149,106,0.1);color:#C8956A;border:1px solid rgba(200,149,106,0.25);}.ta.on{background:rgba(200,149,106,0.25);border-color:#C8956A;}
.tv{background:rgba(82,183,136,0.1);color:#52B788;border:1px solid rgba(82,183,136,0.25);}.tv.on{background:rgba(82,183,136,0.25);border-color:#52B788;}
.tu{background:rgba(192,132,212,0.1);color:#C084D4;border:1px solid rgba(192,132,212,0.25);}.tu.on{background:rgba(192,132,212,0.25);border-color:#C084D4;}
.cb{border-radius:18px;padding:18px 16px;display:none;animation:fu 0.3s ease both;}.cb.on{display:block;}
.cba{font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.06);}
.chi{font-family:'Noto Sans Devanagari',serif;font-size:14px;color:var(--t);line-height:2.1;margin-bottom:14px;font-weight:300;}
.cen{font-family:'EB Garamond',serif;font-style:italic;font-size:15px;color:var(--td);line-height:1.9;padding-top:14px;border-top:1px solid rgba(255,255,255,0.05);}
.ci2{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,0.03);font-size:13px;font-family:'EB Garamond',serif;font-style:italic;line-height:1.7;border-left:3px solid;}
.di{background:var(--b3);border:1px solid var(--bs);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.dq{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.dqt{font-size:13px;color:var(--t);line-height:1.4;flex:1;}
.da2{color:var(--g);font-size:13px;transition:transform 0.3s;flex-shrink:0;}
.di.op .da2{transform:rotate(180deg);}
.da{max-height:0;overflow:hidden;transition:max-height 0.4s ease;}.di.op .da{max-height:600px;}
.dai{padding:0 16px 16px;border-top:1px solid rgba(255,255,255,0.05);padding-top:14px;font-size:13px;color:var(--td);line-height:2;}
.dai strong{color:var(--g);}
.pt{position:fixed;bottom:0;left:0;right:0;background:rgba(8,7,5,0.96);backdrop-filter:blur(20px);border-top:1px solid var(--br);padding:12px 16px 22px;z-index:100;}
.pti{display:flex;align-items:center;gap:12px;max-width:480px;margin:0 auto;}
.ptb{width:50px;height:50px;border-radius:50%;background:var(--b4);border:1px solid var(--br);color:var(--g);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;}
.ptb:disabled{color:var(--tf);border-color:rgba(255,255,255,0.05);background:rgba(255,255,255,0.02);cursor:not-allowed;}
.ptn{background:linear-gradient(135deg,var(--g),var(--gd));color:#000;border-color:transparent;width:54px;height:54px;}
.ptc{flex:1;text-align:center;}.ptl{font-size:11px;color:var(--td);margin-bottom:2px;}.ptn2{font-size:10px;color:var(--tf);}
.dt{display:flex;justify-content:center;gap:5px;margin-top:6px;}
.d{width:6px;height:6px;border-radius:50%;background:var(--tf);transition:all 0.3s;cursor:pointer;}
.d.on{background:var(--g);width:20px;border-radius:3px;}.d.dn{background:var(--gd);}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(201,168,76,0.92);color:#000;font-size:13px;padding:8px 20px;border-radius:20px;opacity:0;transition:all 0.3s;pointer-events:none;z-index:200;white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#C9A84C">
</body>
</html>
